[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugreaper"
version = "4.0.0"
description = "BugReaper X — Autonomous Vulnerability Intelligence Platform by Kairyx Security Solutions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Kairyx Security Solutions", email = "security@kairyx.io" }]
keywords = ["security", "pentesting", "vulnerability", "scanner", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    "typer[all]>=0.12.3",
    "rich>=13.7.1",
    "anthropic>=0.28.0",
    "apscheduler>=3.10.4",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "reportlab>=4.2.0",
    "dnspython>=2.6.1",
    "cryptography>=42.0.7",
    "python-nmap>=0.7.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[project.scripts]
bugreaper = "bugreaper.cli.main:app"
br = "bugreaper.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["bugreaper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
