# Development Environment for MegaZero Agentic Testing
#
# Use this for:
# - Running the agent in a sandboxed environment
# - Testing dangerous commands safely
# - Developing new skills/integrations
#
# Usage:
#   cd dev && ./cli.sh up
#   or from root: ./dev/cli.sh up
name: mega-zero-dev
services:
  # ── The Agent (Development Image) ──
  # Builds from source using the 'dev' stage of the root Dockerfile
  mega-zero-dev:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    container_name: mega-zero-dev
    restart: unless-stopped
    environment:
      - MEGA_ZERO_GATEWAY_PORT=3000
      - SANDBOX_HOST=mega-zero-sandbox
    secrets:
      - source: mega-zero_env
        target: mega-zero_env
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        if [ -f /run/secrets/mega-zero_env ]; then
          set -a
          . /run/secrets/mega-zero_env
          set +a
        fi
        exec mega-zero gateway --port "${MEGA_ZERO_GATEWAY_PORT:-3000}" --host "[::]"
    volumes:
      # Mount single config file (avoids shadowing other files in .mega-zero)
      - ../target/.mega-zero/config.toml:/mega-zero-data/.mega-zero/config.toml
      # Mount shared workspace
      - ../playground:/mega-zero-data/workspace
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - dev-net

  # ── The Sandbox (Ubuntu Environment) ──
  # A fully loaded Ubuntu environment for the agent to play in.
  sandbox:
    build:
      context: sandbox # Context relative to dev/
      dockerfile: Dockerfile
    container_name: mega-zero-sandbox
    hostname: dev-box
    command: ["tail", "-f", "/dev/null"]
    working_dir: /home/developer/workspace
    user: developer
    environment:
      - TERM=xterm-256color
      - SHELL=/bin/bash
    volumes:
      - ../playground:/home/developer/workspace # Mount local playground
    networks:
      - dev-net

networks:
  dev-net:
    driver: bridge

secrets:
  mega-zero_env:
    file: ../.env
